name: Prepare CC0 material photographs
on:
  push:
    branches: [main]
    paths: ['scripts/fetch_materials.py', '.github/workflows/material-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/fetch_materials.py
      - uses: actions/upload-artifact@v4
        with:
          name: licensed-material-photographs
          path: material-build/
